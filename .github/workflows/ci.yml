name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.18.x'
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make test-race
      - run: make build
