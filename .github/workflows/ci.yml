name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.18.x'
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make test-race
      - run: make build

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Set build version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a version tag such as v0.1.0 or v0.1.0-rc.1" >&2
              exit 1
            fi
          else
            version="dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build Linux and macOS archives
        run: make release
      - name: Verify archives and smoke-test the Linux binary
        run: |
          cd dist
          sha256sum --check checksums.txt
          tar -xzf gpttop-linux-amd64.tar.gz
          version_info="$(./gpttop-linux-amd64/gpttop --version)"
          echo "$version_info"
          [[ "$version_info" == "gpttop $VERSION commit="* ]]
          ./gpttop-linux-amd64/gpttop --help
          ./gpttop-linux-amd64/gpttop --demo --once --output json > demo.json
          python3 -m json.tool demo.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: gpttop-${{ github.sha }}
          path: |
            dist/gpttop-*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gpttop-${{ github.sha }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check checksums.txt
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" gpttop-*.tar.gz checksums.txt \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
